name: Fix numToTamilWords

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-num-to-words.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fix to HTML files
        run: |
          python3 << 'PY'
          import pathlib

          def fix(path):
              p = pathlib.Path(path)
              if not p.exists():
                  print('skip missing', path)
                  return False
              text = p.read_text(encoding='utf-8')
              # Match the buggy pattern: parts.push BEFORE n %= 
              old_lakh = (
                  "    if (n >= 100000) {\n"
                  "        const lakh = Math.floor(n / 100000);\n"
                  "        parts.push(getPrefix999(lakh) + (n > 0 ? ' "
              )
              # Find and replace using simpler logic
              import re
              pattern_lakh = re.compile(
                  r"(if \(n >= 100000\) \{\s*"
                  r"const lakh = Math\.floor\(n / 100000\);\s*)"
                  r"(parts\.push\(getPrefix999\(lakh\) \+ \(n > 0 \? '[^']+' : '[^']+'\)\);\s*)"
                  r"(n %= 100000;)"
              )
              pattern_thou = re.compile(
                  r"(if \(n >= 1000\) \{\s*"
                  r"const thou = Math\.floor\(n / 1000\);\s*)"
                  r"(parts\.push\(getPrefix999\(thou\) \+ \(n > 0 \? '[^']+' : '[^']+'\)\);\s*)"
                  r"(n %= 1000;)"
              )
              def repl_lakh(m):
                  return m.group(1) + m.group(3) + "\n        " + m.group(2).strip() + "\n    "
              # Better explicit rebuild
              def fix_block(text, pattern, var, mod):
                  def repl(m):
                      prefix = m.group(1)
                      push = m.group(2).strip()
                      return prefix + mod + "\n        " + push + "\n    }"
                  new_text, n = pattern.subn(repl, text, count=1)
                  return new_text, n
              text2, n1 = fix_block(text, pattern_lakh, 'lakh', 'n %= 100000;')
              text2, n2 = fix_block(text2, pattern_thou, 'thou', 'n %= 1000;')
              if n1 == 0 and n2 == 0:
                  print(path, 'already fixed or pattern not found')
                  return False
              p.write_text(text2, encoding='utf-8')
              print(path, 'fixed', 'lakh', n1, 'thou', n2)
              return True

          changed = False
          for f in ['Worker_Settlement_Corrected.html', 'index.html']:
              if fix(f):
                  changed = True
          print('changed', changed)
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix numToTamilWords: modulo before suffix (85000 -> aayiram)"
            git push
          fi
