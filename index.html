<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>Worker Settlement</title>
<script>
(async function () {
  try {
    const res = await fetch('Worker_Settlement_Corrected.html', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let html = await res.text();

    // --- PDF wording ---
    const wording = [
      ['நிர்வாகத்தின் சார்பில் ஆஜரான</p>\n            <p>பிரதிநிதிகள்</p>',
       'நிர்வாகத்தின் அதிகாரப்பூர்வ</p>\n            <p>பிரதிநிதிகள்</p>'],
      ['மேற்கூறிய நிர்வாகம், இராசிபுரத்தில்', 'மேற்படி நிர்வாகம், இராசிபுரத்தில்'],
      ['தொழிலாளர்கள் தொழிலாளர் துறையில் (ACL) பணிநிறுத்தம்',
       'தொழிலாளர்கள் சேலம் தொழிலாளர் நலத் துறையில் (ACL) பணிநிறுத்தம்'],
      ['பல சுற்றுப் பேச்சுவார்த்தைகள் 21/10/2025',
       'பல சுற்றுப் பேச்சுவார்த்தைகள் முறையே 21/10/2025'],
      ['பணிப்பயன்களை வழங்குமாறும்', 'பணிப்பயன்களை தகுதி உள்ள தொழிலாளர்களுக்கு வழங்குமாறும்'],
      ['அளிக்கப்பட்ட தீர்ப்புகள் மீது எவ்வித',
       'அளிக்கப்பட்ட தீர்ப்புகள் முறையே 11.11.25 மற்றும் 22.09.25 மீது எவ்வித']
    ];
    wording.forEach(function (p) { html = html.split(p[0]).join(p[1]); });

    // --- Worker block: Name → பயிற்சியாளர் → Company → Aadhaar → Mobile ---
    const oldBlock = `            <p><span class="words-blank" id="w_name" contenteditable="true"></span></p>
            <p><span class="words-blank" id="w_full_address" contenteditable="true"></span></p>
            <p id="w_aadhar_row" style="margin-top: 4px;">
                <span id="w_aadhar_label"></span> <span class="words-blank" id="w_aadhar" contenteditable="true"></span>
            </p>
            <p style="margin-top: 4px;">
                <span id="w_phone_label"></span> <span class="words-blank" id="w_phone" contenteditable="true"></span>
            </p>`;
    const newBlock = `            <p><span class="words-blank" id="w_name" contenteditable="true"></span></p>
            <p><span class="words-blank" id="w_designation" contenteditable="true">பயிற்சியாளர்</span></p>
            <p><span class="words-blank" id="w_company" contenteditable="true">திருவள்ளுவர் டெக்ஸ்டைல்ஸ் பிரைவேட் லிமிடெட்</span></p>
            <p id="w_aadhar_row" style="margin-top: 4px;">
                <span id="w_aadhar_label"></span> <span class="words-blank" id="w_aadhar" contenteditable="true"></span>
            </p>
            <p style="margin-top: 4px;">
                <span id="w_phone_label"></span> <span class="words-blank" id="w_phone" contenteditable="true"></span>
            </p>`;
    if (html.indexOf(oldBlock) !== -1) html = html.split(oldBlock).join(newBlock);

    // --- selectWorker JS: designation + company ---
    const oldJs = `    // Employee Name (with Emp No) in pure Tamil straight across, Professional Transliterated Address exactly below it
    if (document.getElementById('w_name')) document.getElementById('w_name').textContent = dispName;
    if (document.getElementById('w_full_address')) {
        const taLines = w.addressLines.map(a => englishToTamil(String(a)).replace(/\\s*,\\s*/g, ', ').replace(/[,\\s]+$/, '').trim()).filter(a => a !== '');
        // drop repeats: same as previous line, or same as the last part of the previous line ("D.N30, Koneripatty" -> "Konerippatty")
        const lastPart = (l) => l.split(',').pop().trim();
        const uniqLines = taLines.filter((l, i) => i === 0 || (l !== taLines[i - 1] && l !== lastPart(taLines[i - 1])));
        const fullAddrStr = uniqLines.join(', ');
        document.getElementById('w_full_address').textContent = fullAddrStr;
    }`;
    const newJs = `    // Employee Name → பயிற்சியாளர் → Company → Aadhaar / Mobile
    if (document.getElementById('w_name')) document.getElementById('w_name').textContent = dispName;
    if (document.getElementById('w_designation')) {
        document.getElementById('w_designation').textContent = 'பயிற்சியாளர்';
    }
    if (document.getElementById('w_company')) {
        document.getElementById('w_company').textContent = 'திருவள்ளுவர் டெக்ஸ்டைல்ஸ் பிரைவேட் லிமிடெட்';
    }`;
    if (html.indexOf(oldJs) !== -1) html = html.split(oldJs).join(newJs);

    // --- Bank A/c (25 underscores), Payment date, Sign date = manual blanks ---
    const BLANK_BANK = '_________________________';
    const BLANK_DATE = '____________________';

    html = html.split('id="bank_ac" contenteditable="true">________').join(
      'id="bank_ac" contenteditable="true">' + BLANK_BANK);
    html = html.split('id="r_bank_ac" contenteditable="true">________').join(
      'id="r_bank_ac" contenteditable="true">' + BLANK_BANK);
    html = html.split('id="pay_date" contenteditable="true">-----------------').join(
      'id="pay_date" contenteditable="true">' + BLANK_DATE);
    html = html.split('id="r_pay_date" contenteditable="true">-----------------').join(
      'id="r_pay_date" contenteditable="true">' + BLANK_DATE);
    html = html.split('id="ag_date" contenteditable="true">').join(
      'id="ag_date" contenteditable="true">' + BLANK_DATE);

    const oldBankFill = "['bank_ac', 'r_bank_ac'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = bankDisp; });";
    const newBankFill = "['bank_ac', 'r_bank_ac'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = '_________________________'; });";
    if (html.indexOf(oldBankFill) !== -1) html = html.split(oldBankFill).join(newBankFill);

    const oldPayFill = "['pay_date', 'r_pay_date'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = payDateDisp; });";
    const newPayFill = "['pay_date', 'r_pay_date'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = '____________________'; });";
    if (html.indexOf(oldPayFill) !== -1) html = html.split(oldPayFill).join(newPayFill);

    const oldAg = "if (document.getElementById('ag_date')) document.getElementById('ag_date').textContent = eff.agDate;";
    const newAg = "if (document.getElementById('ag_date')) document.getElementById('ag_date').textContent = '____________________';";
    if (html.indexOf(oldAg) !== -1) html = html.split(oldAg).join(newAg);

    // --- சாட்சிகள் 1 & 2: 3 line blank space (PDF style, no auto text) ---
    const oldWit = `        <h4>சாட்சிகள்:-</h4>
        <p>1) <span class="words-blank" id="wit1" contenteditable="true"></span></p>
        <p>2) <span class="words-blank" id="wit2" contenteditable="true"></span></p>`;
    const newWit = `        <h4>சாட்சிகள்:-</h4>
        <p style="margin:0 0 2px 0;">1)</p>
        <p style="min-height:3.2em;margin:0 0 8px 0;border-bottom:none;" id="wit1_space">&nbsp;</p>
        <p style="min-height:1.2em;margin:0 0 8px 0;">&nbsp;</p>
        <p style="min-height:1.2em;margin:0 0 12px 0;">&nbsp;</p>
        <p style="margin:0 0 2px 0;">2)</p>
        <p style="min-height:3.2em;margin:0 0 8px 0;">&nbsp;</p>
        <p style="min-height:1.2em;margin:0 0 8px 0;">&nbsp;</p>
        <p style="min-height:1.2em;margin:0 0 12px 0;">&nbsp;</p>
        <span id="wit1" style="display:none;"></span>
        <span id="wit2" style="display:none;"></span>`;
    if (html.indexOf(oldWit) !== -1) html = html.split(oldWit).join(newWit);

    // Do not auto-fill witness names (manual handwriting on print/PDF)
    const oldWitFill = `    // Witnesses
    if (document.getElementById('wit1')) document.getElementById('wit1').textContent = eff.wit1;
    if (document.getElementById('wit2')) document.getElementById('wit2').textContent = eff.wit2;`;
    const newWitFill = `    // Witnesses — left blank for handwritten names/signatures on print/PDF
    if (document.getElementById('wit1')) document.getElementById('wit1').textContent = '';
    if (document.getElementById('wit2')) document.getElementById('wit2').textContent = '';`;
    if (html.indexOf(oldWitFill) !== -1) html = html.split(oldWitFill).join(newWitFill);

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px">Load failed: ' + e.message +
      '</p><p><a href="Worker_Settlement_Corrected.html">Open classic version</a></p>';
  }
})();
</script>
</head>
<body>
<p style="font-family:Latha,Arial,sans-serif;text-align:center;margin-top:40px">Loading…</p>
</body>
</html>
